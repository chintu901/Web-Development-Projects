<!doctype html>
<html lang="en">
  <head>
    <title>Social Login Page</title>
    <link rel="stylesheet" href="/Social-Login-Screen/style.css" />
  </head>
  <body>
    <div class="login-card">
      <h1>Already working together?</h1>
      <p>Login to your account and connect with your teammates!</p>
      <form>
        <input
          type="email"
          id="email-input-box"
          placeholder="Enter your email"
        />
        <button id="arrow-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            aria-hidden="true"
            role="img"
            width="16"
            height="16"
            viewBox="0 0 15 15"
          >
            <path
              fill="currentColor"
              d="M8.293 2.293a1 1 0 0 1 1.414 0l4.5 4.5a1 1 0 0 1 0 1.414l-4.5 4.5a1 1 0 0 1-1.414-1.414L11 8.5H1.5a1 1 0 0 1 0-2H11L8.293 3.707a1 1 0 0 1 0-1.414"
            ></path>
          </svg>
        </button>
      </form>
      <div id="image-wrapper">
        <img src="/image-resources/cat.jpg" alt="black-cat-pic" />
        <img src="/image-resources/chad-cat.jpg" alt="chad-cat-pic" />
        <img src="/image-resources/dog.jpg" alt="praying-dog" />
        <img src="/image-resources/mincreft-cat.jpg" alt="mincreft-cat" />
        <img src="/image-resources/shy-cat.jpg" alt="white-cat" />
      </div>
    </div>
  </body>
</html>
