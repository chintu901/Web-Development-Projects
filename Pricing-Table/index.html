<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Table</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="background-elements">
      <div class="top-row">
        <div class="blue-ball"></div>
        <div class="yellow-ball"></div>
      </div>
      <div class="bottom-row">
        <div class="pink-ball"></div>
        <div class="blank"></div>
      </div>
    </div>
    <main>
      <div class="monthly-plan">
        <h1 class="price-plan-type">Free</h1>

        <h2><span class="dollar-sign">$</span>0</h2>

        <span class="plan-description">Free for your whole team</span>

        <p class="best-suited-for">
          For individuals or teams looking to organize anything.
        </p>

        <button class="action-btn free">Get started</button>
      </div>

      <div class="monthly-plan">
        <h1 class="price-plan-type">Standerd</h1>

        <h2><span class="dollar-sign">$</span>6</h2>

        <span class="plan-description">Per user per month</span>

        <p class="best-suited-for">For teams that need to manage more work.</p>

        <button class="action-btn standard">Upgrade New</button>
      </div>

      <div class="monthly-plan">
        <h1 class="price-plan-type">Premium</h1>

        <h2><span class="dollar-sign">$</span>12</h2>

        <span class="plan-description">Per user per month</span>

        <p class="best-suited-for">
          Best for teams that need to track multiple projects.
        </p>

        <button class="action-btn premium">Try for free</button>
      </div>
    </main>
  </body>
</html>
