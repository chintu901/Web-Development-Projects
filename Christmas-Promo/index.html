<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Promo</title>
    <link rel="stylesheet" href="/Christmas-Promo/style.css" />
  </head>
  <body>
    <main>
      <button id="cancel-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          aria-hidden="true"
          role="img"
          width="18"
          height="18"
          viewBox="0 0 512 512"
          style="color: rgb(74, 85, 101); opacity: 1; transform: rotate(0deg)"
        >
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M420.48 121.813L390.187 91.52L256 225.92L121.813 91.52L91.52 121.813L225.92 256L91.52 390.187l30.293 30.293L256 286.08l134.187 134.4l30.293-30.293L286.08 256z"
          ></path>
        </svg>
      </button>
      <img src="/image-resources/tree-icon.png.png" alt="Christmas Tree" />
      <h1>Merry Christmas!</h1>
      <p>
        you complete all your December's tasks <br />
        so we decided to get you a gift:
      </p>

      <p id="offer-text">50% off your Yearly Premium Plan</p>
      <button id="get-gift-btn">GET YOUR GIFT</button>
    </main>
  </body>
</html>
