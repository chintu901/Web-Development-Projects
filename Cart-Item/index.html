<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart item</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    <link rel="stylesheet" href="/Cart-Item/style.css" />

  <body>
    <main>
      <div class="cart-item">
        <div class="image-side">
          <img
            src="/image-resources/cat-ear-headphone.jpg"
            alt="cat image"
            class="image-area"
          />
        </div>
        <div class="info-side">
          <p id="tag">Free shipping</p>
          <h2>Razer Kraken Kitty Edition Gaming Headset | Black Headphones</h2>
          <p id="old-price">1599,-</p>
          <h1 id="current-price">799,-</h1>
          <small>The offer is valid until april 3 as stock lasts!</small>
          <br />
          <div class="add-to-cart-btn-area">
            <button id="add-to-cart-btn">Add to cart</button>
          </div>

          <small id="small-ball"> 50+ pcs. in stock.</small>
          <div class="btn-area">
            <button>

                xmlns:xlink="http://www.w3.org/1999/xlink"
                aria-hidden="true"
                role="img"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                style="
                  color: rgb(74, 85, 101);
                  opacity: 1;
                  transform: rotate(0deg);
                "
              >
                <path
                  fill="currentColor"
                  d="M16.61 21q-.994 0-1.687-.695q-.692-.696-.692-1.69q0-.15.132-.757l-7.197-4.273q-.324.374-.793.587t-1.007.213q-.986 0-1.676-.702T3 12t.69-1.683t1.676-.702q.537 0 1.007.213t.793.588l7.198-4.255q-.07-.194-.101-.385q-.032-.192-.032-.392q0-.993.697-1.689Q15.625 3 16.62 3t1.688.697T19 5.389t-.695 1.688t-1.69.692q-.542 0-1-.222t-.78-.597l-7.199 4.273q.07.194.101.386q.032.191.032.391t-.032.391t-.1.386l7.198 4.273q.323-.375.78-.597q.458-.222 1-.222q.994 0 1.69.696q.695.698.695 1.693t-.697 1.688t-1.692.692m.004-1q.589 0 .987-.398t.398-.986t-.398-.987t-.986-.398t-.987.398t-.398.986t.398.987t.987.398m-11.25-6.616q.596 0 1-.402q.403-.403.403-.982t-.403-.982t-1-.403q-.581 0-.973.403Q4 11.421 4 12t.393.982t.973.403M17.597 6.37Q18 5.973 18 5.384q0-.588-.398-.986T16.616 4t-.987.398t-.398.987t.403.986t.982.398t.981-.398m-.981-.987"
                ></path></svg
              >Share
            </button>
            <button>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                aria-hidden="true"
                role="img"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                style="
                  color: rgb(74, 85, 101);
                  opacity: 1;
                  transform: rotate(0deg);
                "
              >
                <path
                  fill="currentColor"
                  d="M4.24 12.25a4.2 4.2 0 0 1-1.24-3A4.25 4.25 0 0 1 7.25 5c1.58 0 2.96.86 3.69 2.14h1.12A4.24 4.24 0 0 1 15.75 5A4.25 4.25 0 0 1 20 9.25c0 1.17-.5 2.25-1.24 3L11.5 19.5zm15.22.71C20.41 12 21 10.7 21 9.25A5.25 5.25 0 0 0 15.75 4c-1.75 0-3.3.85-4.25 2.17A5.22 5.22 0 0 0 7.25 4A5.25 5.25 0 0 0 2 9.25c0 1.45.59 2.75 1.54 3.71l7.96 7.96z"

          </div>
        </div>
      </div>
    </main>

</html>
