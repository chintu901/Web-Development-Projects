<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart item</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Cart-Item/style.css" />
  </head>
  <body>
    <main>
      <div class="cart-item">
        <div class="image-side"></div>
        <div class="info-side">
          <p id="tag">Free shipping</p>
          <h2>Headphone</h2>
          <p id="old-price">1599,-</p>
          <h1 id="current-price">799,-</h1>
          <small>The offer is valid until april 3 as stock lasts!</small>
          <br />
          <button id="add-to=cart-btn">Add to cart</button>
          <br />
          <small> 50+ pcs. in stock.</small>
          <div class="btn-area">
            <button>Add to cart</button>
            <button>Add to wishlist</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
