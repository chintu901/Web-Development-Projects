<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Field</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <h1 class="ask-for-password">Enter Your Password</h1>
      <div class="profile-area">
        <img src="/image-resources/stupid-cat.jpg" alt="profile-pic" />
        <div class="info">
          <span class="account-type">Business account</span>
          <p class="name">Billi</p>
        </div>
      </div>
      <input class="password-field" placeholder="Password here.." />
      <div class="btns-area">
        <input type="checkbox" id="toggle" />
        <span>Stay signed in</span>
        <button>Continue</button>
      </div>
      <a href="">Reset Password</a>
    </main>
  </body>
</html>
