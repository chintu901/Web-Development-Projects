<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friend Request Page</title>
    <link rel="stylesheet" href="/Friend-Request/style.css" />
  </head>
  <body>
    <main>
      <div class="friend-request-card">
        <div class="top-header">
          <img src="/image-resources/shy-cat.jpg" alt="profile pic" />
          <h2>Friend Request</h2>
          <button class="view-all-btn">
            <p>View all</p>
          </button>
        </div>
        <div class="request-list-area">
          <ul class="profile-list">
            <li class="profile-list-item">
              <div class="request-profile-image">
                <img src="/image-resources/cat.jpg" alt="profile-1" />
              </div>
              <div class="profile-name">
                <p>Larry</p>
                <small>10 mutual friends</small>
              </div>
              <button class="request-accept-btn">Confirm</button>
            </li>
            <li class="profile-list-item">
              <div class="request-profile-image">
                <img src="/image-resources/chad-cat.jpg" alt="profile-2" />
              </div>
              <div class="profile-name">
                <p>Mr.balls</p>
                <small>2 mutual friends</small>
              </div>
              <button class="request-accept-btn">Confirm</button>
            </li>
            <li class="profile-list-item">
              <div class="request-profile-image">
                <img src="/image-resources/dog.jpg" alt="profile-3" />
              </div>
              <div class="profile-name">
                <p>Dawg</p>
                <small>6 mutual friends</small>
              </div>
              <button class="request-accept-btn">Confirm</button>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
